name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate_html:
    name: validate_html
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate local portfolio contact
        run: bash tests/test_portafolio_contacto.sh

  smoke_test_live:
    name: smoke_test_live
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check published portfolio contact
        run: CHECK_PUBLISHED=1 bash tests/test_portafolio_contacto.sh

