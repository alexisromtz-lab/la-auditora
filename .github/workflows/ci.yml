name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate_html:
    name: validate_html
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test availability monitor
        run: python3 -m unittest discover -s tests -p 'test_monitor_auditora.py' -v
      - name: Test site canary falsifiers
        run: python3 -m unittest discover -s tests -p 'test_canario.py' -v
      - name: Test article page generator falsifiers
        run: python3 -m unittest discover -s tests -p 'test_paginas_articulos.py' -v
      - name: Test English twin falsifiers
        run: python3 -m unittest discover -s tests -p 'test_articulos_en.py' -v
      - name: Test dev.to projection falsifiers
        run: python3 -m unittest discover -s tests -p 'test_devto.py' -v
      # El publicador no tiene red en CI: su transporte es inyectable y todos los
      # falsadores corren contra un transporte falso. En seco no abre conexion.
      - name: Test dev.to publisher falsifiers
        run: python3 -m unittest discover -s tests -p 'test_publicar_devto.py' -v
      - name: dev.to publisher prints a payload without a key
        run: env -u DEVTO_API_KEY python3 tools/publicar_devto.py --raiz . --slug auditoria-litellm-46923-el-bug-que-responde-success
      # Las paginas de articulo son una proyeccion del markdown: si alguien edita
      # la fuente y no regenera, la pagina publica miente. Esta compuerta lo niega.
      - name: Article pages match their markdown source
        run: python3 tools/paginas_articulos.py --raiz . --check
      # La proyeccion dev.to tambien es una proyeccion: un devto.md editado a mano
      # publica un cuerpo que ya no es el del articulo.
      - name: dev.to projections match their markdown source
        run: python3 tools/devto.py --raiz . --check
      - name: Validate local portfolio contact
        run: bash tests/test_portafolio_contacto.sh
      # El canario mide lo que ninguna otra comprobacion mira: enlaces relativos
      # resueltos, informes sin huerfano, ficha completa, metadatos citables
      # legibles y el `rc` declarado contra el devuelto. Offline y sin red.
      - name: Canary of site invariants
        run: python3 tools/canario.py

  smoke_test_live:
    name: smoke_test_live
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Un PR no puede cumplir las aserciones publicadas de su propio contrato: el sitio que
      # se sirve es `main`, así que la página nueva todavía no existe. Este trabajo responde
      # una pregunta que el PR no puede romper: «¿el sitio vivo cumple el contrato que ya
      # está publicado?». El contrato nuevo se verifica después del despliegue
      # (`.github/workflows/post-deploy.yml`).
      - name: Traer el contrato publicado desde main
        run: git fetch --depth=1 origin main && git checkout origin/main -- tests/test_portafolio_contacto.sh
      - name: Comprobar el sitio vivo contra el contrato publicado
        run: CHECK_PUBLISHED=1 bash tests/test_portafolio_contacto.sh

